<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- App Icon: "Gyummy" — A cartoon weekly meal calendar with a cute fork+spoon smiley face -->
  <!-- Rounded square background — warm cream -->
  <rect width="512" height="512" rx="110" fill="#FFF3E0"/>

  <!-- Subtle inner background highlight -->
  <rect x="20" y="20" width="472" height="472" rx="95" fill="#FFFBF5" opacity="0.6"/>

  <!-- Weekly planner grid (calendar-style) -->
  <!-- Main calendar body -->
  <rect x="72" y="145" width="368" height="280" rx="28" fill="#FFFFFF" stroke="#2D2640" stroke-width="10"/>

  <!-- Calendar header bar — warm golden -->
  <rect x="72" y="145" width="368" height="68" rx="28" fill="#FFD13B" stroke="#2D2640" stroke-width="10"/>
  <!-- Fix bottom corners of header -->
  <rect x="72" y="185" width="368" height="30" fill="#FFD13B"/>
  <line x1="82" y1="213" x2="430" y2="213" stroke="#2D2640" stroke-width="10"/>

  <!-- Calendar ring holes (top) -->
  <circle cx="172" cy="135" r="22" fill="#FFFBF5" stroke="#2D2640" stroke-width="8"/>
  <circle cx="256" cy="135" r="22" fill="#FFFBF5" stroke="#2D2640" stroke-width="8"/>
  <circle cx="340" cy="135" r="22" fill="#FFFBF5" stroke="#2D2640" stroke-width="8"/>

  <!-- Calendar header "MON TUE WED THU FRI SAT SUN" dots row simplified as tiny food squares -->
  <!-- Day 1 - green (veggie) -->
  <rect x="94" y="233" width="38" height="38" rx="9" fill="#A8D8A8" stroke="#2D2640" stroke-width="5"/>
  <!-- Day 2 - salmon/pink (protein) -->
  <rect x="146" y="233" width="38" height="38" rx="9" fill="#F4A6A0" stroke="#2D2640" stroke-width="5"/>
  <!-- Day 3 - yellow (carb/grain) -->
  <rect x="198" y="233" width="38" height="38" rx="9" fill="#FFD13B" stroke="#2D2640" stroke-width="5"/>
  <!-- Day 4 - orange (soup) -->
  <rect x="250" y="233" width="38" height="38" rx="9" fill="#FFB347" stroke="#2D2640" stroke-width="5"/>
  <!-- Day 5 - green (veggie) -->
  <rect x="302" y="233" width="38" height="38" rx="9" fill="#A8D8A8" stroke="#2D2640" stroke-width="5"/>
  <!-- Day 6 - pink -->
  <rect x="354" y="233" width="38" height="38" rx="9" fill="#F4A6A0" stroke="#2D2640" stroke-width="5"/>
  <!-- Day 7 - yellow -->
  <rect x="406" y="233" width="38" height="38" rx="9" fill="#FFD13B" stroke="#2D2640" stroke-width="4"/>

  <!-- Second row of day cells (slightly smaller, more condensed) -->
  <rect x="94" y="285" width="38" height="38" rx="9" fill="#FFB347" stroke="#2D2640" stroke-width="5"/>
  <rect x="146" y="285" width="38" height="38" rx="9" fill="#FFD13B" stroke="#2D2640" stroke-width="5"/>
  <rect x="198" y="285" width="38" height="38" rx="9" fill="#F4A6A0" stroke="#2D2640" stroke-width="5"/>
  <rect x="250" y="285" width="38" height="38" rx="9" fill="#A8D8A8" stroke="#2D2640" stroke-width="5"/>
  <rect x="302" y="285" width="38" height="38" rx="9" fill="#FFD13B" stroke="#2D2640" stroke-width="5"/>
  <rect x="354" y="285" width="38" height="38" rx="9" fill="#FFB347" stroke="#2D2640" stroke-width="5"/>
  <rect x="406" y="285" width="38" height="38" rx="9" fill="#F4A6A0" stroke="#2D2640" stroke-width="4"/>

  <!-- Third row -->
  <rect x="94" y="337" width="38" height="38" rx="9" fill="#A8D8A8" stroke="#2D2640" stroke-width="5"/>
  <rect x="146" y="337" width="38" height="38" rx="9" fill="#FFB347" stroke="#2D2640" stroke-width="5"/>
  <rect x="198" y="337" width="38" height="38" rx="9" fill="#FFD13B" stroke="#2D2640" stroke-width="5"/>
  <rect x="250" y="337" width="38" height="38" rx="9" fill="#F4A6A0" stroke="#2D2640" stroke-width="5"/>
  <rect x="302" y="337" width="38" height="38" rx="9" fill="#FFB347" stroke="#2D2640" stroke-width="5"/>
  <rect x="354" y="337" width="38" height="38" rx="9" fill="#A8D8A8" stroke="#2D2640" stroke-width="5"/>
  <rect x="406" y="337" width="38" height="38" rx="9" fill="#FFD13B" stroke="#2D2640" stroke-width="4"/>

  <!-- Cute cartoon fork & spoon making a smiley face, top center -->
  <!-- Fork — left side, rotated slightly inward -->
  <g transform="rotate(-18, 210, 100)">
    <!-- Fork handle -->
    <rect x="200" y="60" width="14" height="62" rx="7" fill="#2D2640"/>
    <!-- Fork tines -->
    <rect x="197" y="28" width="4" height="28" rx="2" fill="#2D2640"/>
    <rect x="204" y="26" width="4" height="30" rx="2" fill="#2D2640"/>
    <rect x="211" y="28" width="4" height="28" rx="2" fill="#2D2640"/>
    <!-- Fork neck -->
    <path d="M197 55 C197 62 216 62 216 55 L216 50 L197 50 Z" fill="#2D2640"/>
  </g>

  <!-- Spoon — right side, rotated inward -->
  <g transform="rotate(18, 302, 100)">
    <!-- Spoon handle -->
    <rect x="297" y="60" width="14" height="62" rx="7" fill="#2D2640"/>
    <!-- Spoon bowl -->
    <ellipse cx="304" cy="36" rx="16" ry="20" fill="#FFD13B" stroke="#2D2640" stroke-width="7"/>
    <!-- Spoon bowl inner gloss -->
    <ellipse cx="299" cy="31" rx="4" ry="5" fill="white" opacity="0.5"/>
  </g>

  <!-- Small heart charm between the fork and spoon (family love / care) -->
  <path d="M248 52 C248 44 256 38 256 38 C256 38 264 44 264 52 C264 60 256 66 256 66 C256 66 248 60 248 52 Z" fill="#F4A6A0" stroke="#2D2640" stroke-width="4"/>
</svg>